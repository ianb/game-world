# Publishes the viewer to GitHub Pages after CI passes on main, so only a green build
# goes live. The site is the static build: the page, the wasm sim, the content bundle
# and the tileset, all on relative paths. Needs Settings → Pages → Source set to
# "GitHub Actions". Can also be run by hand from the Actions tab.
name: pages
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: just build-wasm
      - run: pnpm --filter @game-world/viewer build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
