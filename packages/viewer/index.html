<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>game-world</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; background: #111; color: #ddd; font: 14px/1.25 ui-monospace, monospace; }
      header { padding: 8px 12px; background: #222; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
      main { padding: 12px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
      pre { margin: 0; white-space: pre; overflow-x: auto; }
      canvas.place { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #places { grid-column: 1 / -1; }
      #legend { overflow-x: auto; }
      #days { grid-column: 1 / -1; display: grid; gap: 6px; align-content: start; max-height: 45vh; overflow-y: auto; }
      #days details { border: 1px solid #333; border-radius: 4px; padding: 4px 8px; }
      #days details details { border: none; padding: 0; margin-top: 4px; }
      #days summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
      button.moment { display: grid; grid-template-columns: 6em 1fr; gap: 8px; width: 100%; min-height: 32px; text-align: left; background: none; color: inherit; border: none; border-radius: 4px; padding: 4px 6px; }
      button.moment:hover { background: #2a2a2a; }
      button.moment .when { color: #999; text-align: right; }
      /* Fixed widths so the header does not shift as the clock and labels change. */
      #clock { display: inline-block; min-width: 27ch; }
      #clock.past { color: #e8c76a; }
      #pause { width: 10ch; }
      label.speed { display: inline-flex; gap: 6px; align-items: center; color: #999; }
      select { font: inherit; min-height: 44px; }
      .muted { color: #999; }
      /* Fixed activity width: max-content resized the column as activities changed. */
      #everyone { display: grid; grid-template-columns: max-content 24ch minmax(0, 1fr); gap: 4px 12px; align-items: center; align-content: start; }
      #everyone > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #everyone .muted { color: #999; }
      button.name { min-height: 32px; min-width: 0; padding: 4px 10px; text-align: left; }
      button.name[aria-pressed="true"] { outline: 2px solid #d9a35e; }
      #inspect { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 12.5em; padding: 8px; border: 1px solid #333; border-radius: 4px; font-variant-numeric: tabular-nums; }
      canvas.legend { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      h2 { font-size: 14px; margin: 8px 0 4px; color: #aaa; }
      button { font: inherit; min-height: 44px; min-width: 64px; }
    </style>
  </head>
  <body>
    <header>
      <strong id="clock">loading…</strong>
      <label class="speed">speed <select id="speed"></select></label>
      <button id="pause">pause</button>
      <button id="morning">to 6am</button>
      <button id="back" hidden>back to now</button>
    </header>
    <main>
      <div id="everyone"></div>
      <pre id="inspect">hover or click a tile; click a name for the person</pre>
      <div id="legend"></div>
      <section id="days" aria-label="What happened each day"></section>
      <div id="places"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
