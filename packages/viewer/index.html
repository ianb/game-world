<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>game-world</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; background: #111; color: #ddd; font: 14px/1.25 ui-monospace, monospace; }
      header { padding: 8px 12px; background: #222; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
      main { padding: 12px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
      pre { margin: 0; white-space: pre; overflow-x: auto; }
      canvas.place { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #places { grid-column: 1 / -1; }
      #legend { overflow-x: auto; }
      #everyone { display: flex; flex-wrap: wrap; gap: 6px; }
      button.name { min-height: 32px; min-width: 0; padding: 4px 8px; text-align: left; }
      button.name[aria-pressed="true"] { outline: 2px solid #d9a35e; }
      #inspect { white-space: pre-wrap; min-height: 4.5em; padding: 8px; border: 1px solid #333; border-radius: 4px; }
      canvas.legend { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      h2 { font-size: 14px; margin: 8px 0 4px; color: #aaa; }
      button { font: inherit; min-height: 44px; min-width: 64px; }
      .g-ground { color: #5f9a4a; }
      .g-tall { color: #7fbf5a; font-weight: bold; }
      .g-brush { color: #3f7a3a; }
      .g-weedy { color: #8f8a4a; }
      .g-path { color: #b8923e; }
      .g-track { color: #d9b25a; }
      .g-cowpath { color: #e8c76a; font-weight: bold; }
      .g-blocked { color: #4e7fb8; }
      .g-wall { color: #777; }
      .g-door { color: #eee; font-weight: bold; }
      .g-object { color: #c77dd6; }
      .g-villager { color: #5fe0e0; font-weight: bold; }
    </style>
  </head>
  <body>
    <header>
      <strong id="clock">loading…</strong>
      <span id="speed"></span>
      <button id="pause">pause</button>
      <button id="faster">faster</button>
      <button id="slower">slower</button>
      <button id="day">+1 day</button>
      <button id="text">text</button>
    </header>
    <main>
      <div id="everyone"></div>
      <pre id="inspect">hover or click a tile; click a name for the person</pre>
      <div id="legend"></div>
      <div id="places"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
